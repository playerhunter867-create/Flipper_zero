name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf android-project
          mkdir android-project

          unzip -q "$ZIP" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            echo "The ZIP must contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          echo "Android project: $PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Detect Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using project Gradle Wrapper."
          else
            echo "No Gradle Wrapper found."
            echo "Gradle will be installed by the next step."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p final-apk
          cp "$APK" final-apk/FlipperMobile-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipperMobile-debug
          path: final-apk/FlipperMobile-debug.apk
          if-no-files-found: error
